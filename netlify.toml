[build]
  publish = "."

[[redirects]]
  from = "/index.html"
  to = "/requirement"
  status = 301
  force = true

[[redirects]]
  from = "/tax.html"
  to = "/tax"
  status = 301
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/support.html"
  to = "/tax"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/requirement"
  status = 301
  force = true

[[redirects]]
  from = "/requirement"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/requirement/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/requirement/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tax"
  to = "/tax.html"
  status = 200

[[redirects]]
  from = "/tax/"
  to = "/tax.html"
  status = 200

[[redirects]]
  from = "/tax/*"
  to = "/tax.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200
